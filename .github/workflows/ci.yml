name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t github-actions-docker-demo:${GITHUB_SHA} .

      - name: Start container and smoke-test it
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name demo-test \
            -p 8000:8000 \
            github-actions-docker-demo:${GITHUB_SHA}

          trap 'docker logs demo-test || true; docker rm -f demo-test || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "Application did not become healthy in time"
          docker logs demo-test
          exit 1
